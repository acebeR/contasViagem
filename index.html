<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controle de Despesas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Controle de Despesas</h1>

    <div id="definirPessoas">
      <label for="numPessoas">Número de pessoas (até 10):</label>
      <input type="number" id="numPessoas" min="1" max="10" value="2" />
      <button id="gerarCampos">Gerar campos</button>
    </div>

    <form id="camposNomes" style="display:none;">
      <!-- Campos para nomes serão gerados aqui -->
    </form>

    <form id="adicionarDespesa" style="display:none;">
      <h2>Adicionar Despesa</h2>

      <label for="descricao">Descrição:</label>
      <input type="text" id="descricao" placeholder="Ex: Passagem, Uber..." />

      <label for="pagador">Quem pagou:</label>
      <select id="pagador"></select>

      <label>Participantes que dividiram a despesa:</label>
      <div id="participantes"></div>

      <label for="valor">Valor total (R$):</label>
      <input type="number" id="valor" min="0.01" step="0.01" placeholder="0.00" />

      <button type="button" id="btnAdicionarDespesa">Salvar despesa</button>
    </form>

    <div id="resumo">
      <!-- Tabela de dívidas -->
    </div>

    <div id="listaDespesas">
      <!-- Lista com despesas adicionadas -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
