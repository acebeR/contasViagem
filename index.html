<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controle de Despesas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Controle de Despesas</h1>

    <div class="header">
      <h1>Controle de Despesas</h1>

      <button id="btnInfoProjeto" title="Sobre o projeto"><label class="label-pergunta">?</label></button>
    </div>


    <!-- MODAL -->
    <div id="modalProjeto" class="modal hidden">
      <div class="modal-content">
        <h2>Sobre este projeto</h2>

        <label
          id="descricaoProjeto"
        >Neste Site você poderá cadastrar despesas relacionado a pessoas. O site calcula e retorna o que cada um deve a quem.</label>

        <div class="modal-actions">
          <button class="btn-secundario" id="fecharModalProjeto">Fechar</button>
        </div>
      </div>
    </div>


    <div>
      <label for="numPessoas">Número de pessoas (até 10):</label>
      <input type="number" id="numPessoas" min="1" max="10" value="2" />
      <button id="gerarCampos">Gerar campos</button>
    </div>

    <form id="camposNomes" style="display:none;">
      <h2>Participantes</h2>
      <!-- campos gerados via JS -->
    </form>


    <form id="adicionarDespesa" style="display:none;">
      <h2>Adicionar Despesa</h2>

      <label>Descrição:</label>
      <input type="text" id="descricao">

      <label>Quem pagou:</label>
      <select id="pagador"></select>

      <label>Participantes:</label>
      <div id="participantes"></div>

      <label>Valor:</label>
      <input type="number" id="valor" step="0.01">

      <button type="button" id="btnAdicionarDespesa">Salvar despesa</button>
    </form>

    <div id="resumo"></div>
    <div id="listaDespesas"></div>
  </div>

  <script type="module" src="js/main.js"></script>
  
</body>
</html>
